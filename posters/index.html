<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painting Pixie Posters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;800&display=swap">
<style>
body{margin:0}img{max-width:100%}
.meta a{color:var(--accent);font-weight:800}
/* Layout: a pinboard of four portrait prints in a 2x2 grid (one column on phones); tap a print to see it full size */
:root{
  --bg:#F7F2EA; --card:#FFFFFF; --ink:#1B1712; --muted:#5E5463; --line:#E6DCCF;
  --accent:#B0006A; --gold:#C99A45; --scrim:rgba(20,16,26,.86);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131A; --card:#1F1C25; --ink:#F5F1EA; --muted:#C9C2B8; --line:#34303D;
  --accent:#FF4FA3; --gold:#E2BE7A; --scrim:rgba(8,6,12,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131A; --card:#1F1C25; --ink:#F5F1EA; --muted:#C9C2B8; --line:#34303D;
  --accent:#FF4FA3; --gold:#E2BE7A; --scrim:rgba(8,6,12,.9); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:500 16px/1.55 var(--body)}
.wrap{max-width:1080px;margin:0 auto;padding-block:40px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:800 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
h1{font:700 clamp(32px,5vw,48px)/1.05 var(--display);margin:0 0 10px;text-wrap:balance}
.lede{color:var(--muted);max-width:60ch;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:32px}
.print{display:flex;flex-direction:column;gap:12px;min-width:0}
.print button{all:unset;cursor:zoom-in;display:block;border-radius:6px;background:var(--card);padding:10px;border:1px solid var(--line);box-shadow:0 14px 30px rgba(27,23,18,.12);transition:transform .2s ease}
.print button:hover{transform:translateY(-3px) rotate(-.4deg)}
.print button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.print img{display:block;width:100%;height:auto;aspect-ratio:1588/2246;border-radius:2px}
.print h2{font:700 22px/1.2 var(--display);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px;margin:0}
.tag{font:800 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid currentColor;border-radius:999px;padding:5px 9px;align-self:flex-start}
.note{margin-top:36px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:16px}
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,900px);max-height:94vh}
dialog::backdrop{background:var(--scrim)}
dialog img{display:block;max-width:100%;max-height:88vh;width:auto;height:auto;margin:0 auto;border-radius:4px}
.close{display:block;margin:10px auto 0;font:800 14px/1 var(--body);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer}
.close:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (max-width:760px){.grid{grid-template-columns:1fr;gap:34px;max-width:460px}.wrap{padding-block:28px 40px}}
@media (prefers-reduced-motion:reduce){.print button{transition:none}.print button:hover{transform:none}}
</style>
</head>
<body>

<main class="wrap">
  <p class="eyebrow">The Painting Pixie</p>
  <h1>Posters and flyers</h1>
  <p class="lede">The prints made for venues and Halloween. Tap any one to see it full size. The QR codes on the venue flyers can be scanned straight from the screen.</p>

  <div class="grid">
    <figure class="print">
      <button type="button" data-full="img/woodhatch-flyer.jpg" aria-label="Open the Woodhatch flyer full size"><img src="img/woodhatch-flyer.jpg" alt="Painting Pixie flyer for Woodhatch Community Centre, with a QR code to the Reigate page" width="1200" height="1697"></button>
      <span class="tag">Venue flyer</span>
      <h2>Woodhatch Community Centre</h2>
      <p class="meta"><span>QR code opens the Reigate &amp; Redhill page</span><a href="pdf/Painting-Pixie-Woodhatch-flyer.pdf">Print-ready PDF</a></p>
    </figure>
    <figure class="print">
      <button type="button" data-full="img/st-andrews-flyer.jpg" aria-label="Open the St Andrew's flyer full size"><img src="img/st-andrews-flyer.jpg" alt="Painting Pixie flyer for St Andrew's, in the same layout as the Woodhatch flyer" width="1200" height="1697"></button>
      <span class="tag">Venue flyer</span>
      <h2>St Andrew’s</h2>
      <p class="meta"><span>Same layout as the Woodhatch flyer</span><a href="pdf/Painting-Pixie-St-Andrews-flyer.pdf">Print-ready PDF</a></p>
    </figure>
    <figure class="print">
      <button type="button" data-full="img/halloween-poster.jpg" aria-label="Open the Halloween poster full size"><img src="img/halloween-poster.jpg" alt="Devilishly Good Face Painting Halloween poster" width="1200" height="1697"></button>
      <span class="tag">Halloween</span>
      <h2>Devilishly Good Face Painting</h2>
      <p class="meta"><span>Halloween poster</span><a href="pdf/Devilishly-Good-Face-Painting-poster.pdf">Print-ready PDF</a></p>
    </figure>
  </div>

  <p class="note">Each “Print-ready PDF” link opens the file for printing or saving.</p>
</main>

<dialog id="view" aria-label="Poster full size">
  <img id="viewimg" alt="">
  <button class="close" id="closebtn" type="button">Close</button>
</dialog>

<script>
(function(){
  var d=document.getElementById('view'), img=document.getElementById('viewimg');
  document.querySelectorAll('[data-full]').forEach(function(b){
    b.addEventListener('click',function(){
      img.src=b.getAttribute('data-full'); img.alt=b.querySelector('img').alt;
      if(d.showModal) d.showModal(); else d.setAttribute('open','');
    });
  });
  function close(){ if(d.close) d.close(); else d.removeAttribute('open'); }
  document.getElementById('closebtn').addEventListener('click',close);
  d.addEventListener('click',function(e){ if(e.target===d) close(); });
})();
</script>

</body>
</html>
